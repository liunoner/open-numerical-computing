<title>开源数值仿真导航 · 项目卡片版 Demo</title>
<style>
:root{--ink:#152237;--muted:#607089;--line:#dfe7f1;--canvas:#f4f7fb;--paper:#fff;--brand:#2864dd;--brand-dark:#123c94;--nav:#0c1525;--nav2:#162642;--accent:#25b9a4;--shadow:0 12px 30px rgba(30,55,91,.09)}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 92% 0,#e3efff 0,transparent 28%),var(--canvas);color:var(--ink);font:14px/1.6 Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif}.app{display:grid;grid-template-columns:286px minmax(0,1fr);min-height:100vh}aside{position:sticky;top:0;height:100vh;padding:28px 14px;overflow:auto;background:linear-gradient(160deg,#09111f,#14243f 72%,#0b2940);color:#fff}.brand{margin:0 10px 25px;padding:0 0 18px;border-bottom:1px solid #2c3b55;font-size:20px;font-weight:800;line-height:1.3}.brand small{display:block;margin-top:7px;color:#9eafca;font-size:12px;font-weight:500;letter-spacing:.04em}#nav{display:grid;gap:7px}.nav-item{display:flex;align-items:center;gap:10px;width:100%;min-height:62px;padding:9px 10px;border:1px solid transparent;border-radius:12px;background:transparent;color:#c7d2e5;text-align:left;font:inherit;cursor:pointer;transition:.18s}.nav-item:hover{border-color:#344663;background:#1a2b48;color:#fff}.nav-item.active{border-color:#73a7ff;background:linear-gradient(135deg,#2468d8,#315cc0);box-shadow:0 10px 22px #07132966;color:#fff}.nav-index{display:grid;place-items:center;flex:0 0 31px;width:31px;height:31px;border:1px solid #3a4b68;border-radius:9px;color:#96a9c8;font:700 11px/1 ui-monospace,monospace}.active .nav-index{border-color:#b7d1ff;background:#ffffff1c;color:#fff}.nav-copy{display:grid;min-width:0;gap:1px;flex:1}.nav-copy small{color:#91a3c1;font-size:10px;letter-spacing:.08em}.nav-copy strong{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}.nav-total{color:#9badca;font:700 11px/1 ui-monospace,monospace}.active .nav-total{color:#e6f0ff}main{min-width:0;padding:48px clamp(22px,5vw,76px) 64px}.eyebrow{display:inline-flex;align-items:center;gap:8px;padding:5px 10px;border:1px solid #cfe0ff;border-radius:999px;background:#ffffffc9;color:#215fc7;font-size:11px;font-weight:800;letter-spacing:.11em}.eyebrow:before{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px #25b9a421;content:""}h1{max-width:800px;margin:13px 0 8px;font-size:clamp(30px,4.1vw,48px);line-height:1.12;letter-spacing:-.055em}.lead{max-width:780px;margin:0;color:var(--muted);font-size:15px}.summary{display:flex;flex-wrap:wrap;gap:8px;margin:23px 0 0}.summary span{padding:5px 9px;border:1px solid #d5e2f6;border-radius:7px;background:#fff;color:#52647d;font-size:12px}.summary strong{color:var(--brand-dark)}.toolbar{display:flex;gap:12px;align-items:center;margin:25px 0 26px}.search{width:min(490px,100%);padding:12px 14px;border:1px solid #ccd9eb;border-radius:11px;outline:0;background:#fff;color:var(--ink);font:inherit;box-shadow:0 3px 10px #28476a08}.search:focus{border-color:var(--brand);box-shadow:0 0 0 4px #2864dd18}.count{margin-left:auto;color:#66778f;font-size:12px}.content{display:grid;gap:30px}.group{padding-top:2px}.group-head{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;margin:0 0 14px}.group-marker{display:flex;gap:11px;align-items:center}.group-no{display:grid;place-items:center;width:29px;height:29px;border-radius:8px;background:#e5efff;color:#2864dd;font:800 11px/1 ui-monospace,monospace}.group h2{margin:0;font-size:21px;letter-spacing:-.02em}.group p{max-width:790px;margin:5px 0 0;color:var(--muted)}.group-count{flex:none;margin-top:2px;padding:5px 9px;border-radius:999px;background:#eaf0f9;color:#52647a;font-size:12px}.project-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.project-card{position:relative;display:flex;min-height:206px;flex-direction:column;padding:18px;border:1px solid var(--line);border-radius:15px;background:linear-gradient(145deg,#fff,#fbfdff);box-shadow:0 4px 13px #1d3a6508;transition:transform .18s,box-shadow .18s,border-color .18s}.project-card:hover{z-index:1;border-color:#9cbdf4;box-shadow:var(--shadow);transform:translateY(-4px)}.project-card:before{position:absolute;top:0;right:18px;left:18px;height:3px;border-radius:0 0 3px 3px;background:var(--card-accent);content:""}.card-top{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}.project-title{margin:6px 0 0;font-size:19px;line-height:1.25;letter-spacing:-.025em}.project-title a{color:inherit;text-decoration:none}.project-title a:hover{color:var(--brand)}.kind{color:#67809e;font-size:10px;font-weight:800;letter-spacing:.1em}.source-icon{display:grid;place-items:center;flex:none;width:30px;height:30px;border:1px solid #dbe5f3;border-radius:8px;color:#526986;background:#f8faff;text-decoration:none;font-size:14px;transition:.16s}.source-icon:hover{border-color:#a9c4f4;background:#eaf2ff;color:var(--brand)}.card-copy{display:-webkit-box;overflow:hidden;margin:11px 0 13px;color:#63738a;font-size:12px;-webkit-box-orient:vertical;-webkit-line-clamp:2}.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto}.tag{max-width:100%;overflow:hidden;padding:3px 7px;border:1px solid #dce7f6;border-radius:999px;background:#f5f9ff;color:#42628b;text-overflow:ellipsis;white-space:nowrap;font-size:11px}.detail-link{display:inline-flex;align-items:center;gap:6px;margin-top:15px;color:var(--brand);font-size:12px;font-weight:800;text-decoration:none}.detail-link:after{content:"→";font-size:15px;transition:transform .16s}.detail-link:hover:after{transform:translateX(4px)}.empty{padding:54px 20px;border:1px dashed #b8c8dd;border-radius:14px;color:var(--muted);text-align:center}.detail-view{max-width:1050px}.back{display:inline-flex;align-items:center;gap:6px;margin:0 0 24px;border:0;background:transparent;color:#466282;font:700 13px/1.4 inherit;cursor:pointer}.back:hover{color:var(--brand)}.detail-hero{padding:31px;border:1px solid #dbe6f5;border-radius:20px;background:linear-gradient(135deg,#fff,#eff6ff);box-shadow:var(--shadow)}.detail-hero h1{margin:9px 0;font-size:clamp(34px,5vw,56px)}.detail-hero p{max-width:720px;margin:0;color:#536983;font-size:15px}.detail-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:23px}.button{display:inline-flex;align-items:center;justify-content:center;padding:10px 13px;border:1px solid #2c66d9;border-radius:9px;background:#2864dd;color:#fff;font-size:13px;font-weight:800;text-decoration:none}.button:hover{background:#174fac}.button.ghost{border-color:#c7d9f4;background:#fff;color:#285ba9}.detail-layout{display:grid;grid-template-columns:1fr 290px;gap:18px;margin-top:18px}.detail-panel{padding:21px;border:1px solid var(--line);border-radius:15px;background:#fff}.detail-panel h2{margin:0 0 11px;font-size:17px}.detail-panel p{margin:0;color:var(--muted)}.classification-list{display:grid;gap:9px}.classification{display:block;padding:11px 12px;border:1px solid #dfebf8;border-radius:9px;background:#f8fbff;color:#3d587d;text-decoration:none;font-size:12px}.classification strong{display:block;margin-bottom:2px;color:#1f4e9e}.related{display:grid;gap:8px}.related a{padding:10px 11px;border:1px solid #e0e8f3;border-radius:9px;color:#365b90;background:#fbfdff;text-decoration:none;font-weight:700}.related a:hover{border-color:#a9c5f2;background:#f0f6ff}.detail-note{margin-top:15px;color:#8795a8;font-size:12px}footer{margin-top:38px;color:#8998ab;font-size:12px}@media(max-width:1080px){.project-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:780px){.app{grid-template-columns:1fr}aside{position:static;height:auto;padding:18px 14px}.brand{margin-bottom:14px}#nav{grid-template-columns:repeat(2,minmax(0,1fr))}main{padding:30px 18px 44px}.toolbar{align-items:stretch;flex-direction:column}.count{margin-left:0}.detail-layout{grid-template-columns:1fr}.detail-hero{padding:23px}.project-grid{grid-template-columns:1fr}}@media(max-width:480px){#nav{grid-template-columns:1fr}.group-head{gap:10px;flex-direction:column}.group-count{margin-left:40px}.project-card{min-height:190px}}
</style>
<style>
  /* 左侧树形导航：一级标题仅保留名称，二级标题按悬停状态展开。 */
  #nav{gap:5px}
  .tree-node{border:1px solid #273b58;border-radius:11px;background:#0d1b30;opacity:.76;transition:border-color .18s,background .18s,opacity .18s,box-shadow .18s}
  .tree-node:hover,.tree-node.expanded{border-color:#46698f;background:#14253f;opacity:1}
  .tree-node.active-parent{border-color:#5d94ed;background:linear-gradient(145deg,#18375f,#102744);opacity:1;box-shadow:0 7px 18px #06132555}
  .tree-node.is-muted{opacity:.72}
  .tree-node.is-muted:hover,.tree-node.is-muted.expanded{opacity:.93}
  .tree-primary{display:flex;align-items:center;justify-content:space-between;width:100%;padding:11px 10px;border:0;border-radius:10px;background:transparent;color:#d6e2f5;text-align:left;font:700 14px/1.35 inherit;cursor:pointer}
  .tree-primary:hover,.tree-node.expanded .tree-primary{color:#fff}
  .tree-node.active-parent .tree-primary{color:#fff;font-weight:800}
  .tree-caret{color:#8fa5c8;font-size:16px;line-height:1;transition:transform .18s}
  .tree-node.expanded .tree-caret{transform:rotate(90deg);color:#a8c7ff}
  .tree-children{display:grid;grid-template-rows:0fr;overflow:hidden;opacity:0;transition:grid-template-rows .2s ease,opacity .16s ease}
  .tree-node.expanded .tree-children{grid-template-rows:1fr;opacity:1}
  .tree-children-inner{min-height:0;padding:2px 7px 7px}
  .tree-child{position:relative;display:block;width:100%;margin:5px 0;padding:8px 9px 8px 17px;border:1px solid #2d4565;border-radius:8px;background:#10223a;color:#bdcae0;text-align:left;font:12px/1.4 inherit;cursor:pointer;opacity:.8;transition:border-color .16s,background .16s,color .16s,opacity .16s,transform .16s}
  .tree-child:before{position:absolute;top:0;bottom:0;left:8px;width:1px;background:#426181;content:""}
  .tree-child:after{position:absolute;top:50%;left:8px;width:5px;height:1px;background:#6680a5;content:""}
  .tree-child:hover{border-color:#5d86bd;background:#1c3659;color:#fff;opacity:1;transform:translateX(2px)}
  .tree-node.active-parent .tree-child:not(.current){opacity:.76}
  .tree-child.current{border-color:#77a8ff;background:linear-gradient(135deg,#2a6be0,#2355b5);color:#fff;font-weight:800;opacity:1;box-shadow:0 5px 12px #071b3e77}
  .tree-child.current:before,.tree-child.current:after{background:#d5e5ff}
  .context-hero{position:sticky;top:14px;z-index:20;margin:0 0 17px;padding:21px 25px;border:1px solid #c9daf4;border-radius:18px;background:linear-gradient(120deg,#fff 0%,#f5f9ff 69%,#eaf3ff);box-shadow:0 14px 34px #244e8417}
  .context-path{margin:0 0 8px;color:#3e69a8;font-size:11px;font-weight:800;letter-spacing:.1em}
  .context-hero h1{margin:0;max-width:900px;font-size:clamp(30px,4.2vw,48px)}
  .context-hero p{max-width:780px;margin:7px 0 0;color:#566d8d;font-size:14px}
  .context-meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:15px}
  .context-meta span{padding:4px 8px;border:1px solid #d4e1f2;border-radius:7px;background:#fff;color:#55708f;font-size:12px}
  .context-meta strong{color:#225bbd}
  .content{gap:38px}
  .group{padding:18px;border:1px solid transparent;border-radius:18px;scroll-margin-top:230px;transition:background .18s,border-color .18s}
  .group.is-current{border-color:#c9dcfa;background:#f8fbff}
  .group-no{display:none}
  .group-head{margin-bottom:10px}
  .group h2{font-size:21px}
  @media(max-width:780px){#nav{grid-template-columns:1fr}.context-hero{position:static;padding:21px}.group{padding:12px 0;scroll-margin-top:0}.group.is-current{padding:14px;border-radius:14px}.context-hero h1{font-size:32px}}
</style>
<style>
  /* 连续内容页：全部一级与二级方向都位于同一条可滚动阅读流中。 */
</style>
<style>
  /* 项目卡片：名称、核心能力、客观属性与详情入口。 */
  .project-card{min-height:250px;padding:16px}
  .card-top{display:grid;min-height:55px;margin:-16px -16px 0;place-items:center;border-radius:15px 15px 0 0}
  .project-title{min-height:0;width:100%;margin:0;padding:14px 20px 7px;color:var(--ink);text-align:center;font-size:24px}
  .project-title a{color:inherit}
  .project-title a:hover{color:var(--brand);text-decoration:underline;text-underline-offset:3px}
  .project-card .card-summary{min-height:37px;margin:20px 0 8px;color:#4d627e;font-size:15px;line-height:1.52}
  .project-card .tags{position:relative;display:flex;min-width:0;min-height:30px;gap:6px;margin:0;align-items:center;flex-wrap:nowrap;overflow:hidden}
  .project-card .tags.has-flyout{overflow:visible}
  .project-card .tags.has-collapsed-peers{gap:0}
  .project-card .tag{min-width:0;max-width:100%;flex:0 1 auto;overflow:hidden;padding:4px 8px;background:#f7faff;text-align:center;text-overflow:ellipsis;white-space:nowrap;font-size:11px;transition:border-color .16s ease,background .16s ease}
  .project-card .tag.is-truncated{cursor:help}
  .project-card .tag.is-expanded{z-index:1;border-color:#8eb4ef;background:#eef5ff}
  .project-card .tag.is-collapsed{width:0!important;min-width:0!important;max-width:0!important;flex:0 0 0!important;padding:0!important;border:0!important;margin:0!important;opacity:0;pointer-events:none}
  .project-card .tag-flyout{position:absolute;bottom:calc(100% + 6px);left:0;z-index:5;width:max-content;max-width:min(420px,calc(100vw - 40px));padding:5px 9px;border:1px solid #8eb4ef;border-radius:8px;background:#eef5ff;color:#42628b;box-shadow:0 8px 18px #1d3a6526;overflow-wrap:anywhere;white-space:normal;font-size:11px;line-height:1.45}
  .project-card .tag.pending{border-style:dashed;background:#fafbfd;color:#6d7b8e}
  .card-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:auto;padding-top:7px}
  .project-card .detail-link,.project-card .card-source{display:inline-flex;align-items:center;justify-content:center;width:100%;margin:0;padding:7px 9px;border:1px solid #c5d9f7;border-radius:8px;background:#eff5ff;color:#1d5fcb;font-size:12px;font-weight:800;text-decoration:none;transition:transform .16s ease,box-shadow .16s ease,background .16s ease,border-color .16s ease,color .16s ease}
  .project-card .detail-link:after{content:none}
  .project-card:hover .detail-link,.project-card:hover .card-source{border-color:#7caaf0;background:#e2eeff}
  .project-card .detail-link:hover,.project-card .card-source:hover,.project-card .detail-link:focus-visible,.project-card .card-source:focus-visible{border-color:#2864dd;background:linear-gradient(135deg,#2864dd,#397de7);color:#fff;box-shadow:0 8px 16px #2864dd42;transform:translateY(-2px)}
  .project-card .detail-link:focus-visible,.project-card .card-source:focus-visible{outline:3px solid #9fc1f5;outline-offset:2px}
  @media(max-width:480px){.project-card{min-height:250px}.card-actions{grid-template-columns:1fr}}
</style>
<style>
  /* 桌面端：顶部二级方向信息固定，只有下方项目目录可以滚动。 */
  @media(min-width:781px){
    main{display:flex;height:100vh;flex-direction:column;overflow:hidden;padding-bottom:28px}
    .context-hero{position:relative;top:auto;flex:none}
    .project-scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:6px 13px 52px 0;scrollbar-gutter:stable}
    .project-scroll .content{gap:26px}
    .project-scroll footer{margin-top:30px}
  }
</style>
<style>
  /* 右侧全项目索引：字母轨道仅在靠近右边界时出现。 */
  .project-index{position:relative;display:flex;min-width:0;height:100vh;flex-direction:column;overflow:hidden;padding:18px 28px 16px 16px;border-left:1px solid #dbe5f2;background:#fbfdff;color:#1a2b45;box-shadow:-8px 0 24px #1d3d6610}
  .index-title{display:flex;align-items:baseline;justify-content:space-between;margin:0 0 10px;color:#233955;font-size:14px;font-weight:800}
  .index-title span{color:#74869d;font-size:11px;font-weight:600}
  .index-search{width:100%;padding:10px 11px;border:1px solid #cddbec;border-radius:9px;outline:0;background:#fff;color:#203149;font:12px/1.4 inherit}
  .index-search:focus{border-color:#5e91e5;box-shadow:0 0 0 3px #3c79d514}
  .index-list{min-height:0;flex:1;margin-top:13px;overflow-y:auto;padding:0 3px 24px 0;scrollbar-width:thin;scrollbar-color:#b5c6dc transparent}
  .index-group{margin:0 0 11px;scroll-margin-top:8px}
  .index-group h3{position:sticky;top:0;z-index:1;margin:0;padding:3px 0 5px;border-bottom:1px solid #e3ebf5;background:#fbfdff;color:#4770aa;font-size:11px;font-weight:900;letter-spacing:.12em}
  .index-item{display:block;width:100%;overflow:hidden;padding:5px 7px;border:1px solid transparent;border-radius:7px;background:transparent;color:#344c6c;text-align:left;text-overflow:ellipsis;white-space:nowrap;font:12px/1.35 inherit;cursor:pointer}
  .index-item:hover,.index-item.active{border-color:#bcd4f6;background:#eaf3ff;color:#1f61c8;font-weight:800}
  .index-empty{padding:22px 8px;color:#7d8da1;font-size:12px;text-align:center}
  .index-rail{position:absolute;top:76px;right:3px;bottom:18px;z-index:3;display:flex;width:23px;align-items:center;justify-content:center;opacity:0;pointer-events:none;transform:translateX(7px);transition:opacity .16s,transform .16s;touch-action:none}
  .project-index.rail-revealed .index-rail,.project-index:focus-within .index-rail,.index-rail:hover{opacity:1;pointer-events:auto;transform:translateX(0)}
  .index-letter-list{position:relative;display:grid;width:100%;height:min(468px,100%);grid-template-rows:repeat(27,minmax(0,1fr));align-items:center}
  .index-letter{position:relative;z-index:1;width:23px;height:100%;padding:0;border:0;border-radius:6px;background:transparent;color:#60748e;font-size:9px;font-weight:800;cursor:pointer}
  .index-letter:hover,.index-letter.active{background:#2864dd;color:#fff}
  .index-letter:disabled{color:#c1cad6;cursor:default}
  .index-letter:disabled:hover{background:transparent;color:#c1cad6}
  .index-thumb{position:absolute;top:var(--active-letter-top,0%);right:0;width:23px;height:3.7037%;border:1px solid #8db4f2;border-radius:6px;background:#dceaffaa;pointer-events:none;transition:top .12s}
  @media(min-width:1181px){
    .app{grid-template-columns:286px minmax(0,1fr) 262px}
    .project-index{position:sticky;top:0}
  }
  @media(min-width:781px) and (max-width:1500px){.project-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
  @media(min-width:781px) and (max-width:1180px){
    .project-index{position:fixed;top:0;right:0;z-index:50;width:262px;transform:translateX(calc(100% - 15px));transition:transform .2s}
    .project-index:hover,.project-index:focus-within{transform:translateX(0)}
  }
  @media(max-width:780px){
    .project-index{position:fixed;top:0;right:0;z-index:60;width:min(278px,88vw);transform:translateX(calc(100% - 14px));transition:transform .2s}
    .project-index:hover,.project-index:focus-within{transform:translateX(0)}
  }
 </style>
<style>
  /* 左侧文件树与右侧索引栏使用统一的浅色导航配色。 */
  .app>aside:not(.project-index){border-right:1px solid #dbe5f2;background:linear-gradient(180deg,#fff 0%,#f5f9ff 100%);color:#1a2b45;box-shadow:8px 0 24px #1d3d660b}
  .app>aside:not(.project-index){display:flex;flex-direction:column;overflow:hidden}
  .sidebar-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 12px;padding:10px 12px;border:1px solid #cfe0f7;border-radius:10px;background:linear-gradient(135deg,#f8fbff,#eaf3ff);box-shadow:0 4px 11px #2b5c9510;color:#233955;font-size:15px}
  .sidebar-title strong{letter-spacing:.01em}
  .sidebar-total{flex:none;padding:4px 7px;border:1px solid #bfd5f6;border-radius:999px;background:#fff;color:#2a64bc;font-size:11px;font-weight:800;white-space:nowrap}
  .app>aside:not(.project-index) #nav{flex:1;min-height:0;align-content:start;overflow-y:auto;padding:0 2px 4px 0}
  .app>aside:not(.project-index) .tree-node{border-color:#d9e4f1;background:#fff;box-shadow:0 2px 7px #294c7607}
  .app>aside:not(.project-index) .tree-node:hover,.app>aside:not(.project-index) .tree-node.expanded{border-color:#b8d0f4;background:#f8fbff}
  .app>aside:not(.project-index) .tree-node.active-parent{border-color:#77a5ea;background:linear-gradient(145deg,#eff6ff,#e3efff);box-shadow:0 7px 18px #3570bd17}
  .app>aside:not(.project-index) .tree-node.is-muted{opacity:.88}
  .app>aside:not(.project-index) .tree-node.is-muted:hover,.app>aside:not(.project-index) .tree-node.is-muted.expanded{opacity:1}
  .app>aside:not(.project-index) .tree-primary{color:#2f4d70;font-weight:700}

<style>
  /* Project detail pages: structured from 开源项目资料/二级页面-项目详情.md */
  .detail-scroll{min-height:0;flex:1;overflow-y:auto;overscroll-behavior:contain;padding:4px 15px 56px 0;scrollbar-gutter:stable}
  .project-detail{max-width:1120px;margin:0 auto}
  .project-detail .back{display:inline-flex;align-items:center;gap:9px;margin:0 0 17px;padding:11px 17px;border:1px solid #2864dd;border-radius:10px;background:#fff;color:#1958b9;box-shadow:0 7px 18px #2864dd24;font:800 14px/1.3 inherit;letter-spacing:.01em;transition:transform .16s,box-shadow .16s,background .16s,color .16s;cursor:pointer}
  .project-detail .back:hover{background:#2864dd;color:#fff;box-shadow:0 10px 24px #2864dd42;transform:translateY(-2px)}
  .project-detail .back:focus-visible{outline:3px solid #8db5f5;outline-offset:3px}
  .app.is-detail-page>aside{filter:blur(2px) grayscale(.3);opacity:.48;pointer-events:none;user-select:none;transition:filter .18s,opacity .18s}
  .project-detail-hero{position:relative;overflow:hidden;padding:clamp(25px,4vw,46px);border:1px solid #c9dcf7;border-radius:24px;background:linear-gradient(130deg,#0d2452,#1d63bd 58%,#54b7ca);color:#fff;box-shadow:0 18px 42px #1a4d8a32}
  .project-detail-hero:after{position:absolute;right:-90px;bottom:-125px;width:350px;height:350px;border:1px solid #ffffff4a;border-radius:50%;box-shadow:0 0 0 44px #ffffff12,0 0 0 88px #ffffff0a;content:""}
  .project-detail-hero>*{position:relative;z-index:1}
  .detail-kicker{margin:0 0 10px;color:#c8e4ff;font-size:11px;font-weight:900;letter-spacing:.13em}
  .project-detail-hero h1{max-width:850px;margin:0;font-size:clamp(36px,5vw,62px);line-height:1.08;letter-spacing:-.055em}
  .detail-hero-copy{max-width:720px;margin:13px 0 0;color:#e9f4ff;font-size:15px}
  .detail-facts{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
  .detail-facts span{padding:5px 9px;border:1px solid #ffffff45;border-radius:7px;background:#ffffff15;color:#f4f9ff;font-size:12px}
  .detail-actions .button{border-color:#fff;background:#fff;color:#174eaa}
  .detail-actions .button:hover{background:#e7f2ff}
  .detail-actions .button.ghost{border-color:#b8d8ff;background:#ffffff17;color:#fff}
  .detail-actions .button.ghost:hover{background:#ffffff2b}
  .detail-anchor-nav{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}
  .detail-anchor-nav a,.detail-anchor-nav button{padding:7px 10px;border:1px solid #d5e3f5;border-radius:999px;background:#fff;color:#3b5f91;font:800 12px/1.4 inherit;text-decoration:none;cursor:pointer}
  .detail-anchor-nav a:hover,.detail-anchor-nav button:hover{border-color:#84ace7;background:#edf5ff;color:#165bc1}
  .detail-content{display:grid;gap:16px}
  .detail-section{display:grid;grid-template-columns:58px minmax(0,1fr);gap:17px;padding:25px;border:1px solid #dce7f3;border-radius:18px;background:#fff;box-shadow:0 6px 18px #24456f09;scroll-margin-top:22px}
  .detail-section-no{display:grid;place-items:center;width:42px;height:42px;border-radius:12px;background:#e9f2ff;color:#2364c9;font:900 13px/1 ui-monospace,monospace}
  .detail-section h2{margin:1px 0 11px;font-size:21px;letter-spacing:-.03em}
  .detail-section p{max-width:850px;margin:0 0 12px;color:#536983}
  .detail-section p:last-child{margin-bottom:0}
  .detail-highlight{padding:15px 17px;border:1px solid #b8d5ff;border-radius:12px;background:linear-gradient(100deg,#edf5ff,#f9fcff);color:#244d82}
  .detail-source-link{display:flex;align-items:center;gap:10px;max-width:850px;margin:13px 0;padding:13px 15px;border:1px solid #92b8ee;border-radius:11px;background:#f3f8ff;color:#155dc4;font-weight:800;text-decoration:none;word-break:break-all}
  .detail-source-link:hover{border-color:#2864dd;background:#e6f1ff}
  .detail-source-link small{color:#6f85a3;font-size:11px;font-weight:700;letter-spacing:.06em;white-space:nowrap}
  .detail-list{display:grid;gap:8px;margin:12px 0 0;padding:0;list-style:none}
  .detail-list li{position:relative;padding:10px 13px 10px 29px;border:1px solid #e0e9f4;border-radius:10px;background:#fbfdff;color:#526a88}
  .detail-list li:before{position:absolute;top:17px;left:13px;width:7px;height:7px;border-radius:50%;background:#35a68e;content:""}
  .detail-meta-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin-top:14px}
  .detail-meta-grid div{padding:11px;border:1px solid #e0e9f4;border-radius:10px;background:#fbfdff}
  .detail-meta-grid small{display:block;margin-bottom:3px;color:#7890ac;font-size:10px;font-weight:900;letter-spacing:.08em}
  .detail-meta-grid strong{color:#36516f;font-size:13px}
  .detail-footer{margin:4px 0 0;color:#8494a9;font-size:12px}
  .detail-modal-backdrop{position:fixed;z-index:100;inset:0;display:grid;place-items:center;padding:22px;background:#07152a66;backdrop-filter:blur(4px)}
  .detail-modal{position:relative;width:min(510px,100%);padding:31px 31px 27px;border:1px solid #c5d9f6;border-radius:19px;background:linear-gradient(145deg,#fff,#f5f9ff);color:var(--ink);box-shadow:0 24px 70px #0718325c}
  .detail-modal-close{position:absolute;top:13px;right:13px;display:grid;place-items:center;width:32px;height:32px;padding:0;border:1px solid #d4e0f1;border-radius:9px;background:#fff;color:#58708e;font:500 24px/1 Arial,sans-serif;cursor:pointer}
  .detail-modal-close:hover{border-color:#8fb3e9;background:#eaf3ff;color:#185cbd}
  .detail-modal-kicker{margin:0 0 9px;color:#2864dd;font-size:11px;font-weight:900;letter-spacing:.12em}
  .detail-modal h2{margin:0 35px 10px 0;font-size:23px;line-height:1.3;letter-spacing:-.03em}
  .detail-modal p{margin:0;color:#5a6e89;font-size:14px}
  .detail-modal-note{display:flex;gap:8px;align-items:flex-start;margin-top:18px;padding:11px 12px;border:1px solid #d7e6fa;border-radius:10px;background:#eef6ff;color:#38618f;font-size:12px}
  .detail-modal-note:before{display:grid;place-items:center;flex:none;width:17px;height:17px;border-radius:50%;background:#2864dd;color:#fff;font:900 11px/1 Arial,sans-serif;content:"i"}
  @media(max-width:780px){.detail-scroll{overflow:visible;padding-right:0}.project-detail-hero{padding:26px 22px}.detail-section{grid-template-columns:1fr;padding:20px}.detail-section-no{width:36px;height:36px}.detail-meta-grid{grid-template-columns:1fr}.detail-anchor-nav{gap:6px}.detail-modal{padding:27px 23px 23px}}
</style>
</head>

function route(){const hash=decodeURIComponent(location.hash.slice(1));if(hash.startsWith('project=')){renderDetail(hash.slice(8));return}if(hash.startsWith('category=')){const index=Number(hash.slice(9));if(Number.isInteger(index)&&sections[index]){active=index;currentItem=0}}drawNav();renderCategory()}

function navigateToGroup(sectionIndex,itemIndex,shouldScroll){const hadQuery=Boolean(query);active=sectionIndex;currentItem=itemIndex;query='';if(hadQuery)renderLibrary();focusGroup(sectionIndex,itemIndex,shouldScroll)}

function renderLibrary(){const normalized=query.trim().toLowerCase();const visibleSections=sections.map((section,sectionIndex)=>({...section,sectionIndex,items:section.items.map((item,itemIndex)=>({...item,itemIndex,projects:item.projects.filter(project=>!normalized||[project.name,item.title,section.title].join(' ').toLowerCase().includes(normalized))})).filter(item=>item.projects.length)})).filter(section=>section.items.length);const total=sections.reduce((count,section)=>count+section.items.reduce((sum,item)=>sum+item.projects.length,0),0);const current=sections[active].items[currentItem]||sections[active].items[0];main.innerHTML='<section class="context-hero" id="context-hero"><div class="context-path" data-context-path>'+esc(sections[active].title)+' · 二级方向</div><h1 data-context-title>'+esc(current.title)+'</h1><p data-context-intro>'+esc(introFor(sections[active],current))+'</p><div class="context-meta"><span><strong data-context-count>'+current.projects.length+' 个项目入口</strong></span><span>滚动右侧页面即可浏览全部分类</span><span>左侧目录随当前位置同步</span></div></section><div class="toolbar"><input id="search" class="search" type="search" value="'+esc(query)+'" placeholder="在全部项目和二级方向中搜索…"><span class="count">'+(normalized?'匹配 '+visibleSections.reduce((n,section)=>n+section.items.reduce((m,item)=>m+item.projects.length,0),0)+' 个项目':'共 '+total+' 个项目入口')+'</span></div><section class="library">'+(visibleSections.length?visibleSections.map(section=>'<section class="primary-section" id="primary-'+section.sectionIndex+'"><header class="primary-head"><div><div class="primary-kicker">一级分类</div><h2>'+esc(section.title)+'</h2><p>'+esc(primaryIntro(section))+'</p></div><span class="primary-total">'+section.items.length+' 个二级方向</span></header><div class="content">'+section.items.map(item=>'<section class="group '+(section.sectionIndex===active&&item.itemIndex===currentItem?'is-current':'')+'" id="group-'+section.sectionIndex+'-'+item.itemIndex+'" data-section="'+section.sectionIndex+'" data-item="'+item.itemIndex+'"><div class="group-head"><div class="group-marker"><div><h2>'+esc(item.title)+'</h2><p>'+esc(introFor(section,item))+'</p></div></div><span class="group-count">'+item.projects.length+' 个项目</span></div><div class="project-grid">'+item.projects.map(project=>projectCard(project,item,section)).join('')+'</div></section>').join('')+'</div></section>').join(''):'<div class="empty">没有找到与“'+esc(query)+'”匹配的项目或二级方向。</div>')+'</section><footer>项目数据来自《开源数值仿真项目调研目录》。本页为单文件静态交互演示。</footer>';document.querySelector('#search').addEventListener('input',event=>{query=event.target.value;renderLibrary()});document.querySelectorAll('.group').forEach(group=>group.addEventListener('mouseenter',()=>focusGroup(Number(group.dataset.section),Number(group.dataset.item),false)));window.removeEventListener('scroll',syncFromScroll);window.addEventListener('scroll',syncFromScroll,{passive:true});updateContext();requestAnimationFrame(syncFromScroll)}
function syncFromScroll(){if(scrollFrame)return;scrollFrame=requestAnimationFrame(()=>{scrollFrame=0;const hero=document.querySelector('#context-hero'),anchor=(hero?hero.getBoundingClientRect().bottom:150)+18;let candidate=null;document.querySelectorAll('.group').forEach(group=>{const rect=group.getBoundingClientRect();if(rect.bottom<=anchor||rect.top>=window.innerHeight)return;const distance=rect.top<=anchor?0:rect.top-anchor;if(!candidate||distance<candidate.distance)candidate={group,distance}});if(candidate)focusGroup(Number(candidate.group.dataset.section),Number(candidate.group.dataset.item),false)})}
function renderCategoryContinuousLegacy(){renderLibrary()}

  });
}
function renderCategory(){
